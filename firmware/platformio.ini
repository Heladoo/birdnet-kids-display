; BirdNET Kids home display: Waveshare ESP32-S3-ePaper-1.54.
; Needs Arduino-ESP32 3.x (ext1 wake-up on any-low), so the pioarduino platform, not the
; stock espressif32 one. `stable` floats: once it builds and works, pin the release.
;
;   pio run -t upload        firmware
;   pio run -t uploadfs      the bird pack (data/cards/, made by tools/build_pack.py)
;   pio device monitor
;   pio run -e demo -t upload   fixed data on screen, serial 'a' / 'd' / 'n' (see src/main.cpp)

[platformio]
default_envs = bird_display

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 115200
board_upload.flash_size = 8MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
; Octal PSRAM boards (N8R8) and plain ones both boot with dio flash; PSRAM stays unused.
board_build.arduino.memory_type = dio_opi
lib_deps =
    zinggjm/GxEPD2@^1.6.4
    bblanchon/ArduinoJson@^7.4.1
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:bird_display]

[env:bird_debug]
build_flags =
    ${env.build_flags}
    -DDEBUG_LOG

[env:demo]
build_flags =
    ${env.build_flags}
    -DDEMO_MODE
