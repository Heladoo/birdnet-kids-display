; BirdNET Kids home display: Waveshare ESP32-S3-ePaper-1.54.
; Needs Arduino-ESP32 3.x (ext1 wake-up on any-low), so the pioarduino platform, not the
; stock espressif32 one. `stable` floats: once it builds and works, pin the release.
;
;   pio run -t upload        firmware
;   pio run -t uploadfs      the bird pack (data/cards/, made by tools/build_pack.py)
;   pio device monitor
;   pio run -e demo -t upload   fixed data on screen, serial 'a' / 'd' / 'n' (see src/main.cpp)

[platformio]
default_envs = bird_display

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 115200
board_upload.flash_size = 8MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
; Octal PSRAM boards (N8R8) and plain ones both boot with dio flash; PSRAM stays unused.
board_build.arduino.memory_type = dio_opi
lib_deps =
    zinggjm/GxEPD2@^1.6.4
    bblanchon/ArduinoJson@^7.4.1
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
; The sound proof of concept lives in src/sound/ and has its own env; keep it out of the others.
build_src_filter = +<*> -<sound/>

[env:bird_display]

[env:bird_debug]
build_flags =
    ${env.build_flags}
    -DDEBUG_LOG

[env:demo]
build_flags =
    ${env.build_flags}
    -DDEMO_MODE

; Sound POC stage 0: a generated beep through the ES8311 and the speaker (src/sound/beep_test.cpp).
[env:sound_beep]
build_src_filter = -<*> +<sound/beep_test.cpp>

; Sound POC stage 1: stream an MP3 from GitHub Pages, decode (Helix), play (src/sound/stream_test.cpp).
; Needs include/secrets.h. The Helix wrapper is GPL-3, the decoder RealNetworks RPSL.
[env:sound_stream]
build_src_filter = -<*> +<sound/stream_test.cpp>
lib_deps =
    https://github.com/pschatzmann/arduino-libhelix.git#v0.9.4
build_flags =
    ${env.build_flags}
    -DHELIX_LOGGING_ACTIVE=false
